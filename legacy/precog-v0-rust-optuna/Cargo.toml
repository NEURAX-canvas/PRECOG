[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/taskgen",
    "crates/model",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
